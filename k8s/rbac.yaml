apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafanadb-restore-api
  namespace: db-operations
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafanadb-restore-api
  namespace: db-operations
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafanadb-restore-api
  namespace: db-operations
subjects:
  - kind: ServiceAccount
    name: grafanadb-restore-api
    namespace: db-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafanadb-restore-api
